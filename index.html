<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="目标清单">
<title>目标清单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%234C9A6A'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23EDF1E6'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#EDF1E6;--card:#FCFDF9;--card2:#F4F7EE;--line:#DCE4D4;--ink:#2F3A2E;--muted:#7A8578;
--green:#4C9A6A;--blue:#3E7CB1;--amber:#C08A3E;--purple:#8E6BBF;--coral:#D9706C;--pink:#D1789F;
--danger:#D64545;--warn:#D9922E;--radius:14px;--shadow:0 2px 10px rgba(47,58,46,.07);
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#app{display:flex;gap:16px;max-width:1500px;margin:0 auto;padding:16px;align-items:flex-start}
#sidebar{width:218px;position:sticky;top:16px;flex:none;display:flex;flex-direction:column;gap:12px}
#main{flex:1;min-width:0}
#rail{width:252px;position:sticky;top:16px;flex:none;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px}
.logo .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logo .lg .ic{width:22px;height:22px;stroke-width:2}
.logo b{font-size:1.05rem;line-height:1.2}
.logo small{display:block;color:var(--muted);font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .ic{color:var(--green)}
.card h4{font-size:.9rem;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card h4 .ic{color:var(--green)}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;font-size:.95rem;color:var(--ink);transition:.15s;text-align:left}
.nav-i:hover{background:var(--card2)}
.nav-i.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(76,154,106,.3)}
.nav-i.active .ic{color:#fff}
.ss{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
.ss:last-child{border-bottom:none}
.ss b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:.9rem;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#3f8657;color:#fff}
.btn.danger{color:var(--danger);border-color:#f0c6c6}
.btn.danger:hover{background:#fdf1f1;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.block{width:100%;justify-content:center}
.btn .ic{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.75rem;color:#fff;font-weight:600}
.tag.risk{background:var(--danger)}
.tag.warn{background:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .5s}
.sec{margin-top:16px}
.sec>.card{margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:.85rem;border:1px dashed var(--line);border-radius:10px;background:var(--card2)}
#tabbar{display:none}
#mhead{display:none}
.banner{position:relative;border-radius:18px;padding:20px 22px;color:#fff;overflow:hidden;margin-bottom:16px;box-shadow:0 6px 20px rgba(47,58,46,.12)}
.banner .banner-ribbon{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#f6d365,#fda085,#f6d365,#84fab0,#8fd3f4,#f6d365);background-size:300% 100%;animation:rib 6s linear infinite}
@keyframes rib{to{background-position:300% 0}}
.banner.day{background:linear-gradient(120deg,#4C9A6A,#6db489 55%,#7fb069)}
.banner.night{background:linear-gradient(120deg,#7a3b3b,#b04a3a 55%,#c98a3d)}
.banner .b-ic{position:absolute;right:18px;top:18px;width:40px;height:40px;opacity:.9}
.banner .b-ic .ic{width:40px;height:40px;stroke-width:1.4}
.banner h1{font-size:1.3rem;margin-bottom:6px;padding-right:54px}
.banner p{font-size:.9rem;opacity:.95;padding-right:54px}
.banner.night h1{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;position:relative}
.badge .badge-ic{width:38px;height:38px;margin:0 auto 6px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.badge .badge-ic .ic{width:22px;height:22px}
.badge b{display:block;font-size:.88rem;margin-bottom:2px}
.badge span{font-size:.75rem;color:var(--muted)}
.badge .bar{height:6px;margin-top:8px}
.badge.on{border-color:var(--amber);background:linear-gradient(160deg,#fff8e8,#fdeed2)}
.badge.on .badge-ic{color:var(--amber);background:#ffeecf}
.badge.on .bar i{background:linear-gradient(90deg,#e8a33d,#e86a8f)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.layer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.layer h4{font-size:.85rem;display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--ink)}
.layer h4 .ic{width:15px;height:15px}
.li{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.82rem;cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:var(--card2);border-radius:8px}
.li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted);flex:none}
.todo{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:12px;margin-bottom:10px}
.todo.overdue{border-left-color:var(--danger);background:#fdf6f5}
.todo .t-main{flex:1;min-width:0}
.todo .t-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.todo .t-title{font-weight:600;font-size:.95rem}
.todo .t-desc{color:var(--muted);font-size:.82rem;margin-top:2px}
.todo .t-meta{color:var(--muted);font-size:.75rem;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.todo .t-actions{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.todo .t-actions .btn{padding:6px 10px;font-size:.8rem}
.od-badge{background:var(--danger);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 8px;font-weight:700}
.per-badge{background:var(--card2);color:var(--muted);border-radius:99px;font-size:.7rem;padding:1px 8px}
.todo .prog{margin-top:6px}
.done{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;opacity:.72}
.done .smile{color:var(--green);margin-top:2px}
.done .t-title{font-weight:600;font-size:.92rem}
.done .sum{color:#44523f;font-size:.82rem;margin-top:3px}
.done .rev{color:var(--muted);font-size:.8rem;margin-top:2px;background:var(--card2);border-radius:8px;padding:6px 8px}
.done .praise{color:var(--green);font-size:.78rem;font-weight:700;white-space:nowrap}
.goal{border-top:4px solid var(--green)}
.goal.danger{border-top-color:var(--danger)}
.goal.warn{border-top-color:var(--warn)}
.g-head{display:flex;gap:14px;align-items:center}
.ring{width:104px;height:104px;flex:none}
.ring .ring-bg{fill:none;stroke:var(--line);stroke-width:9}
.ring .ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.ring .ring-n{font-size:19px;font-weight:700;fill:var(--ink)}
.ring .ring-l{font-size:10px;fill:var(--muted)}
.g-info{flex:1;min-width:0}
.g-tags{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.g-info h3{font-size:1.1rem}
.g-info p{color:var(--muted);font-size:.83rem;margin-top:2px}
.g-meta{display:flex;gap:18px;margin-top:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.g-meta span{display:flex;align-items:center;gap:4px}
.g-meta b{color:var(--ink)}
.g-meta .ic{width:14px;height:14px;color:var(--green)}
.g-bars{margin-top:12px}
.g-bar-title{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.chart{width:100%;height:84px}
.chart .cb{fill:var(--green)}
.chart .cb.off{fill:var(--line)}
.chart .cb[data-today]{fill:var(--amber)}
.chart .bar-n{font-size:10px;fill:var(--muted);text-anchor:middle}
.chart .bar-w{font-size:10px;fill:var(--muted);text-anchor:middle}
.g-done{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.g-done-i{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.85rem;opacity:.75}
.g-done-i .ic{color:var(--green);width:16px;height:16px}
.g-done-i em{color:var(--green);font-style:normal;font-size:.78rem;margin-left:auto}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-head b{font-size:1.05rem;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-w{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0}
.cal-cell{min-height:72px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:hover{border-color:var(--green);box-shadow:var(--shadow)}
.cal-cell.dim{opacity:.45}
.cal-cell.today{border-color:var(--green);background:#f2f8f1;box-shadow:0 0 0 1px var(--green)}
.cal-d{font-size:.75rem;color:var(--muted);font-weight:600;display:block;padding:2px 4px}
.cal-cell.today .cal-d{color:var(--green)}
.cal-chip{font-size:.68rem;padding:1px 5px;border-radius:6px;background:var(--card2);border-left:3px solid var(--c,#4C9A6A);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cal-more{font-size:.68rem;color:var(--muted);margin-top:2px;text-align:center}
#pop{position:fixed;z-index:200;width:290px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(47,58,46,.2);padding:10px;display:none}
.pop-t{font-size:.85rem;font-weight:700;margin-bottom:8px;color:var(--green)}
.pop-i{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:.82rem}
.pop-i:last-of-type{border-bottom:none}
.pop-i b{display:block;font-size:.85rem}
.pop-i small{color:var(--muted);font-size:.72rem}
.pop-a{margin-left:auto;display:flex;gap:4px}
.pop-a button{padding:4px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.pop-a button:hover{color:var(--green);border-color:var(--green)}
.pop-empty{color:var(--muted);text-align:center;padding:14px;font-size:.8rem}
#modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.ov{position:absolute;inset:0;background:rgba(47,58,46,.4)}
.md{position:relative;background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.md h3{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.md h3 .ic{color:var(--green)}
.md label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.md-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.md-body{color:var(--muted);font-size:.9rem;line-height:1.6}
.code{width:100%;min-height:180px;font-family:Consolas,Menlo,monospace;font-size:.78rem;line-height:1.5;background:var(--card2)}
.eval{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.eval b{color:var(--green);font-size:.85rem;display:block;margin-bottom:4px}
.eval p{font-size:.85rem;color:var(--ink);line-height:1.6}
.eval.cross{border-color:#dcd3f0;background:#f6f3fc}
.eval.cross b{color:var(--purple)}
.tradio{display:inline-flex;align-items:center;gap:6px;margin:6px 10px 0 0;font-size:.85rem;cursor:pointer}
.tradio input{width:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink);margin-top:10px}
.chk input{width:auto}
.wd-cb{border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:0;cursor:pointer;background:var(--card)}
.switch{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:12px;font-size:.9rem;cursor:pointer}
.switch input{width:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#2f3a2e;color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:400;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:1.2rem;display:block;color:var(--green)}
.stat span{font-size:.75rem;color:var(--muted)}
.row2{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.r-stat{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.r-stat b{color:var(--green)}
.r-chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.r-chk b{font-size:.8rem}
.r-chk small{display:block;color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.r-chk .dot{margin-top:5px}
.quote p{font-size:.85rem;line-height:1.7}
@media(max-width:1180px){#rail{display:none}}
@media(max-width:768px){
#app{flex-direction:column;padding:10px 12px 80px;align-items:stretch}
#sidebar{display:none}
#mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.layers{grid-template-columns:1fr}
#tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(252,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabbar .nav-i{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 0;border-radius:10px;justify-content:center;text-align:center}
#tabbar .nav-i .ic{width:20px;height:20px}
.todo{flex-direction:column}
.todo .t-actions{width:100%;justify-content:flex-end}
.g-head{flex-direction:column;align-items:flex-start}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.cal-cell{min-height:56px}
#pop{width:240px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c6d2be;border-radius:99px}

/* 重要倒计时 */
.cd-card .cd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.cd-card .cd-item.done{opacity:.55}
.cd-card .cd-item.cd-today{background:rgba(76,154,106,.08);border-color:var(--green)}
.cd-card .cd-item.cd-past{opacity:.7}
.cd-info{flex:1;min-width:0}
.cd-info b{display:block;font-size:.88rem}
.cd-info span{color:var(--muted);font-size:.75rem}
.cd-actions{display:flex;gap:6px;flex:none}
.cd-hidden{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.todo.today-done{opacity:.62}
.cd-card{margin-top:12px}
.layers{margin-top:12px}
.badge-card h2 .ic{width:15px;height:15px;color:var(--green)}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-today" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9M10 20v-5h4v5"/></symbol>
<symbol id="i-board" viewBox="0 0 24 24"><path d="M5 15a7 7 0 1 1 14 0"/><path d="M12 15l4.5-4"/><circle cx="12" cy="15" r=".8" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-week" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h6M10 16h6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
<symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
<symbol id="i-defer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><path d="M18 4l2 3h-3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19l1-3L17 5l2 2L8 18l-3 1z"/><path d="M14 7l3 3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V4h11v1"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 19h16"/></symbol>

<script>
'use strict';
/* ========== 常量 ========== */
const LS_KEY='lifelong-goal-board';
const THEMES=['学习','健康','工作','理财','人际','兴趣'];
const THEME_COLOR={'学习':'#E07B39','健康':'#D4A92B','工作':'#4C9A6A','理财':'#3E7CB1','人际':'#5B5FA6','兴趣':'#8E6BBF'};

const TABS=[['today','今日','today'],['board','看板','board'],['week','周报','week'],['cal','日历','cal'],['me','我的','me']];
const KW={
'学习':['学习','英语','单词','听力','阅读','读书','书','课程','笔记','练习','复习','背诵','默写','精听','词汇','口语','跟读','写作','知识','技能','教程','TED','复盘','学到','理解','考试','训练营','雅思','连读'],

'工作':['工作','项目','周报','数据','公众号','选题','竞品','爆款','客户','会议','汇报','方案','需求','交付','运营','涨粉','打开率','阅读量','PPT','初稿','发布','文章'],

'人际':['人际','朋友','家人','爸妈','沟通','关系','陪伴','合作','约会','聚会','聊天','感谢','团队','电话'],

};

'学习':['把今天学到的内容用费曼技巧讲给朋友听','给本周学习定一个可量化的验收标准（能默写/能复述/能讲解）','把输入转成输出：写一条卡片笔记或做一次小练习'],
'健康':['把运动安排在固定时段，形成生物钟','本周加一项微习惯：如每天多喝两杯水或走 6000 步','记录一次睡眠，看看作息对状态的影响'],
'工作':['把今天的成果沉淀成可复用的模板或清单','给下周最重要的一件事排出前三步','用数据验证一个假设，再迭代下一步'],
'理财':['今天把一笔支出记进账本了吗','给本月设一个储蓄目标并自动划转','复盘一次冲动消费，找出触发场景'],
'人际':['主动给一位重要的人发条消息或约一次见面','把「谢谢」说具体：感谢对方帮了你什么','每周安排一次高质量的深度聊天'],
'兴趣':['给兴趣留出固定时间，哪怕 20 分钟','把兴趣作品分享到一个小圈子，获得反馈','用兴趣做一次跨界：和主业或学习结合']
};
/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>fmt(new Date());
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;};
const startOfMonth=d=>new Date(d.getFullYear(),d.getMonth(),1);
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const icon=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const short=s=>String(s).length>24?String(s).slice(0,24)+'…':String(s);
const nowStamp=()=>{const d=new Date();return fmt(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
/* ========== 存储 ========== */
let DB=null;
const state={tab:'today',calY:new Date().getFullYear(),calM:new Date().getMonth(),weekStart:startOfWeek(new Date()),showHiddenEvents:false};
function defaultSettings(){return {autoDefer:true,rewards:[
{id:'r1',name:'7天大餐',icon:'meal',track:'streak',threshold:7},
{id:'r2',name:'130天国内游',icon:'car',track:'streak',threshold:130},
{id:'r3',name:'180天出国游',icon:'plane',track:'streak',threshold:180}
],kw:KW,sync:{enabled:false,key:'',lastSyncAt:null,serverUpdatedAt:0},holidays:['2026-01-01','2026-01-02','2026-01-03','2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-02-23','2026-04-04','2026-04-05','2026-04-06','2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20','2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07']};}
function emptyState(){
const T=todayStr();
return {goals:[],tasks:[],checkins:[],events:[],settings:defaultSettings(),meta:{createdAt:Date.now(),updatedAt:Date.now(),lastAutoDeferDate:T}};
}
function migrate(raw){
const d=(raw&&typeof raw==='object')?raw:{};
const out={
schemaVersion:1,
goals:(Array.isArray(d.goals)?d.goals:[]).map(g=>({
id:g.id||uid(),title:String(g.title||'未命名目标'),desc:String(g.desc||''),theme:THEMES.includes(g.theme)?g.theme:'学习',
unit:String(g.unit||'次'),target:Number(g.target)||1,current:Number(g.current)||0,
startDate:g.startDate||null,endDate:g.endDate||null
})),
tasks:(Array.isArray(d.tasks)?d.tasks:[]).map(t=>({
id:t.id||uid(),title:String(t.title||'未命名任务'),desc:String(t.desc||''),category:THEMES.includes(t.category)?t.category:'工作',
goalId:t.goalId||null,startDate:t.startDate||null,dueDate:t.dueDate||null,period:!!t.period,
status:t.status==='done'?'done':'todo',priority:[0,1,2,3].includes(t.priority)?t.priority:1,
progress:Number(t.progress)||0,summary:String(t.summary||''),review:String(t.review||''),deferCount:Number(t.deferCount)||0,
checkins:Array.isArray(t.checkins)?t.checkins:[],doneDates:Array.isArray(t.doneDates)?t.doneDates:[],weekdays:Array.isArray(t.weekdays)?t.weekdays.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[0,1,2,3,4,5,6],skipHolidays:!!t.skipHolidays,createdAt:t.createdAt||Date.now(),
completedAt:t.completedAt||null,updatedAt:t.updatedAt||Date.now()
})),
checkins:(Array.isArray(d.checkins)?d.checkins:[]).map(c=>({
id:c.id||uid(),date:String(c.date||todayStr()),taskId:c.taskId||null,type:['感悟','视频链接','成品','通用'].includes(c.type)?c.type:'通用',
content:String(c.content||''),amount:Number(c.amount)||0,unit:String(c.unit||''),evaluation:String(c.evaluation||''),suggestions:Array.isArray(c.suggestions)?c.suggestions:[],
themes:Array.isArray(c.themes)?c.themes:[],cross:String(c.cross||''),createdAt:c.createdAt||Date.now()
})),
events:(Array.isArray(d.events)?d.events:[]).map(e=>({id:e.id||uid(),title:String(e.title||'未命名事件'),date:String(e.date||todayStr()),done:!!e.done,createdAt:e.createdAt||Date.now(),updatedAt:e.updatedAt||Date.now()})),
settings:Object.assign(defaultSettings(),(d.settings&&typeof d.settings==='object')?d.settings:{}),
meta:Object.assign({createdAt:Date.now(),updatedAt:Date.now(),lastAutoDeferDate:null},(d.meta&&typeof d.meta==='object')?d.meta:{})
};
out.settings.kw=Object.assign({},KW,(d.settings&&d.settings.kw)?d.settings.kw:{});
out.settings.sync=Object.assign({enabled:false,key:'',lastSyncAt:null,serverUpdatedAt:0},(d.settings&&d.settings.sync)||{});
return out;
}
function save(){DB.meta.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){showToast('保存失败：本地存储空间不足');}scheduleSyncPush();}
function load(){
try{
const raw=localStorage.getItem(LS_KEY);
if(!raw){DB=migrate(emptyState());DB.meta.lastAutoDeferDate=todayStr();save();return;}
DB=migrate(JSON.parse(raw));
}catch(e){DB=migrate(emptyState());DB.meta.lastAutoDeferDate=todayStr();save();}
}
function autoDefer(){
const s=DB.settings;if(!s.autoDefer)return 0;
const T=todayStr();
if(DB.meta.lastAutoDeferDate===T)return 0;
let n=0;
DB.tasks.forEach(t=>{if(t.status==='todo'&&t.dueDate&&t.dueDate<T&&!t.period){t.dueDate=fmt(addDays(new Date(),1));t.deferCount=(t.deferCount||0)+1;t.updatedAt=Date.now();n++;}});
DB.meta.lastAutoDeferDate=T;
if(n)save();
return n;
}
/* ========== 连续打卡 ========== */
function streakInfo(){
const set=new Set(DB.checkins.map(c=>c.date));
let anchor=new Date();
if(!set.has(fmt(anchor)))anchor=addDays(anchor,-1);
if(!set.has(fmt(anchor)))return {streak:0,lastDate:null,activeDays7:0};
let min=null;
DB.checkins.forEach(c=>{const d=parseD(c.date);if(!min||d<min)min=d;});
let streak=0,win=[],d=new Date(anchor);
while(d>=min){
const act=set.has(fmt(d));
win.push(act);if(win.length>7)win.shift();
if(win.filter(x=>!x).length>1)break;
streak++;d=addDays(d,-1);
}
let a7=0;for(let i=0;i<7;i++){if(set.has(fmt(addDays(new Date(),-i))))a7++;}
return {streak,lastDate:fmt(anchor),activeDays7:a7};
}
/* ========== 打卡成果验证引擎 ========== */
function detectType(c){
if(/https?:\/\/\S+/i.test(c))return '视频链接';
const r=['感悟','心得','体会','学到','收获','意识到','反思','复盘','思考','觉得','发现'].filter(k=>c.includes(k)).length;
const p=['完成','做好','搞定','成品','产出','写完','做出','交付','突破','发布','初稿'].filter(k=>c.includes(k)).length;
if(r>p&&r>0)return '感悟';
if(p>0)return '成品';
return '通用';
}
function matchThemes(c){
const hits=[];
THEMES.forEach(th=>{const kws=KW[th].filter(k=>c.includes(k));if(kws.length)hits.push({theme:th,kws,score:kws.length});});
return hits.sort((a,b)=>b.score-a.score);
}
function makeEval(type,c,hits){
const s=short(c);
const base={
'感悟':'今天的记录很有复盘感：「'+s+'」。能把过程沉淀成经验，说明你在用成长型思维做事，建议把这条感悟直接转成一个下周的行动。',
'视频链接':'你选择了用优质内容给自己充电：「'+s+'」。输入之后的关键是输出——试着用三句话复述核心观点，或动手实践一次。',
'成品':'今天有看得见的产出：「'+s+'」。成品是学习/工作闭环里最重要的一环，它把「我学过了」变成「我做到了」。',
'通用':'稳定输出的一天：「'+s+'」。别小看日拱一卒，连续的小动作正在悄悄拉开差距，求上进就藏在这些日常里。'
}[type];
const th=hits[0]?hits[0].theme:null;
return th?base+' 本次打卡命中了「'+th+'」主题。':base;
}
function makeSuggestions(hits){
const s=[];
hits.slice(0,3).forEach((h,i)=>{const bank=SUG[h.theme]||SUG['学习'];s.push('【'+h.theme+'】'+(bank[i%bank.length]||bank[0]));});
if(!s.length)s.push('试着给打卡加一句「明天的一个小动作」，让行动连续起来。');
return s;
}
function makeCross(hits){
if(hits.length<2)return null;
const a=hits[0].theme,b=hits[1].theme;
return '跨主题交叉分析：今天的记录同时涉及「'+a+'」和「'+b+'」。试着把两者结合——用'+a+'的产出反哺'+b+'，或让'+b+'成为'+a+'的练习场景。主题交叉处往往是成长最快的区域，坚持这样的「复合打卡」会带来复利效果。';
}
/* ========== UI 基础 ========== */
let toastTimer=null;
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function openModal(html){const m=$('#modal');m.innerHTML='<div class="ov" onclick="App.closeModal()"></div><div class="md" onclick="event.stopPropagation()">'+html+'</div>';m.classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML='';}
function confirmModal(title,body,okText){return new Promise(res=>{openModal('<h3>'+icon('alert')+esc(title)+'</h3><p class="md-body">'+body+'</p><div class="md-actions"><button class="btn" onclick="App.closeModal();window.__cf(false)">取消</button><button class="btn primary" onclick="App.closeModal();window.__cf(true)">'+esc(okText||'确定')+'</button></div>');window.__cf=res;});}
function openPop(anchor,html){
const p=$('#pop');
p.innerHTML=html;p.style.display='block';
const r=anchor.getBoundingClientRect();
const pw=p.offsetWidth,ph=p.offsetHeight;
let x=r.left;if(x+pw>innerWidth-8)x=Math.max(8,innerWidth-pw-8);
let y=r.bottom+6;if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-6);
p.style.left=x+'px';p.style.top=y+'px';
}
function closePop(){$('#pop').style.display='none';$('#pop').innerHTML='';}
function copyText(txt){
return new Promise(res=>{
function fb(){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();res(ok);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>res(true)).catch(fb);}else fb();
});
}
/* ========== 通用渲染助手 ========== */
function quote(){
const s=streakInfo().streak;
const od=DB.tasks.filter(t=>t.status==='todo'&&t.dueDate&&t.dueDate<todayStr()).length;
const h=new Date().getHours();
if(h>=22||h<5)return '深夜是和自己对话最好的时间。把今天最后一件小事做完，再睡。';
if(od>0)return '还有 '+od+' 项逾期任务，现在就处理，别让它们过夜。';
if(s>0)return '已连续坚持 '+s+' 天，每周休一天也不断——你比想象中更能坚持。';
return '求上进，从完成今天第一件事开始。';

function bars7(theme,goalId){
const days=[];
for(let i=6;i>=0;i--){
const ds=fmt(addDays(new Date(),-i));
const n=DB.checkins.filter(c=>c.date===ds&&((!theme)||(c.themes&&c.themes.includes(theme))||(!c.themes&&matchThemes(c.content).some(h=>h.theme===theme))||(goalId&&c.taskId&&(DB.tasks.find(t=>t.id===c.taskId)||{}).goalId===goalId))).length;
days.push({ds,n,w:(parseD(ds).getMonth()+1)+'/'+parseD(ds).getDate()});
}
const max=Math.max(1,...days.map(d=>d.n));
let bars='';
days.forEach((d,i)=>{
const x=4+i*40,h=Math.round(d.n/max*54)+4,y=72-h;
bars+='<g><rect x="'+x+'" y="'+y+'" width="30" height="'+h+'" rx="4" class="cb '+(d.n?'':'off')+'"'+(d.ds===todayStr()?' data-today':'')+'/><text x="'+(x+15)+'" y="66" text-anchor="middle" class="bar-n">'+(d.n||'')+'</text><text x="'+(x+15)+'" y="82" text-anchor="middle" class="bar-w">'+d.w+'</text></g>';
});

}

/* ========== 云同步（Netlify Blobs） ========== */
const SYNC_ENDPOINT='/.netlify/functions/sync';
let syncTimer=null;
function syncEnabled(){return !!(DB.settings.sync&&DB.settings.sync.enabled&&DB.settings.sync.key);}
function syncSet(partial){DB.settings.sync=Object.assign({enabled:false,key:'',lastSyncAt:null,serverUpdatedAt:0},DB.settings.sync||{},partial);}
function scheduleSyncPush(){if(!syncEnabled())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncPush().catch(()=>{});},1500);}
async function syncPull(){
  if(!syncEnabled())return;
  try{
    const res=await fetch(SYNC_ENDPOINT+'?key='+encodeURIComponent(DB.settings.sync.key));
    if(!res.ok)return;
    const j=await res.json();
    const remote=j&&j.data;
    if(remote&&remote.meta&&(remote.meta.updatedAt||0)>(DB.meta.updatedAt||0)){
      DB=migrate(remote);
      DB.meta.updatedAt=Date.now();
      save();
      render();
      showToast('已从云端拉取最新数据');
    }else if(!remote){
      await syncPush();
    }
  }catch(e){}
}
async function syncPush(){
  if(!syncEnabled())return false;
  const payload=JSON.parse(JSON.stringify(DB));
  payload.meta.updatedAt=Date.now();
  try{
    const res=await fetch(SYNC_ENDPOINT+'?key='+encodeURIComponent(DB.settings.sync.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)return false;
    syncSet({lastSyncAt:Date.now(),serverUpdatedAt:payload.meta.updatedAt});
    localStorage.setItem(LS_KEY,JSON.stringify(DB));
    return true;
  }catch(e){return false;}
}
async function syncNow(){
  if(!syncEnabled()){showToast('请先开启云同步并填写同步密码');return;}
  const before=DB.meta.updatedAt||0;
  await syncPull();
  if((DB.meta.updatedAt||0)===before){await syncPush();}
  showToast('同步完成，上次同步 '+((DB.settings.sync.lastSyncAt)?new Date(DB.settings.sync.lastSyncAt).toLocaleString():'刚刚'));
}
function setSyncEnabled(v){syncSet({enabled:v});save();if(v){syncNow();}render();}
function setSyncKey(v){syncSet({key:String(v||'').trim()});save();}

function goalAdd(id,delta){const g=DB.goals.find(x=>x.id===id);if(!g)return false;g.current=Math.max(0,(Number(g.current)||0)+delta);g.updatedAt=Date.now();return true;}
function done(id){
const t=DB.tasks.find(x=>x.id===id);if(!t)return;
if(t.period&&t.status==='todo'&&isPeriodDay(t,todayStr())){
const T=todayStr();
if(!(t.doneDates||[]).includes(T)){t.doneDates=(t.doneDates||[]).concat(T);if(t.goalId)goalAdd(t.goalId,1);}
t.updatedAt=Date.now();settlePeriods();save();closePop();render();showToast('今日已完成，明天继续');return;
}
t.status='done';t.progress=100;t.completedAt=nowStamp();t.updatedAt=Date.now();if(t.goalId)goalAdd(t.goalId,1);save();closePop();render();showToast('已完成，求上进！');
}

/* ========== 重复任务（按周 + 法定节假日） ========== */
function isHoliday(ds){return (DB.settings.holidays||[]).includes(ds);}
function periodWeekdays(t){
const wd=(t.weekdays&&t.weekdays.length)?t.weekdays:[0,1,2,3,4,5,6];
if(wd.length===7)return '每日';
const names=wd.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(n=>'周'+WEEK_CN[n]);
return '每周'+wd.length+'次 · '+names.join('');
}
function isPeriodDay(t,ds){
if(!t.period||!t.startDate||!t.dueDate)return false;
if(ds<t.startDate||ds>t.dueDate)return false;
const wd=(t.weekdays&&t.weekdays.length)?t.weekdays:[0,1,2,3,4,5,6];
if(!wd.includes(parseD(ds).getDay()))return false;
if(t.skipHolidays&&isHoliday(ds))return false;
return true;
}
function periodTotal(t){if(!t.period||!t.startDate||!t.dueDate)return 0;let n=0;for(let d=parseD(t.startDate);fmt(d)<=t.dueDate;d=addDays(d,1)){if(isPeriodDay(t,fmt(d)))n++;}return n;}
function periodDoneCount(t){if(!t.period)return 0;return (t.doneDates||[]).filter(ds=>t.startDate<=ds&&ds<=t.dueDate).length;}
function periodProgress(t){const tot=periodTotal(t);return tot?Math.round(periodDoneCount(t)/tot*100):0;}
function settlePeriods(){
const T=todayStr();let changed=false;
DB.tasks.forEach(t=>{
if(!t.period||t.status==='done'||!t.startDate||!t.dueDate)return;
if(T<=t.dueDate)return;
if(periodDoneCount(t)>=periodTotal(t)){t.status='done';t.progress=100;t.completedAt=t.dueDate+' 23:59';t.updatedAt=Date.now();changed=true;}
});
if(changed)save();
}
function undoDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;const T=todayStr();if((t.doneDates||[]).includes(T)){t.doneDates=(t.doneDates||[]).filter(d=>d!==T);if(t.goalId)goalAdd(t.goalId,-1);}t.updatedAt=Date.now();save();closePop();render();showToast('已撤销今日完成');}

function goalManage(){
openModal('<h3>'+icon('target')+'目标管理</h3>'+
(DB.goals.length?DB.goals.map(g=>'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer" onclick="App.goalModal(\''+g.id+'\')"><span class="dot" style="background:'+THEME_COLOR[g.theme]+'"></span><div style="flex:1;min-width:0"><b style="font-size:.88rem">'+esc(g.title)+'</b><div style="font-size:.72rem;color:var(--muted)">'+g.theme+' · '+clamp(Math.round(g.current/g.target*100),0,100)+'%</div></div><button class="btn sm" onclick="event.stopPropagation();App.goalModal(\''+g.id+'\')">'+icon('edit')+'</button><button class="btn sm danger" onclick="event.stopPropagation();App.delGoal(\''+g.id+'\')">'+icon('trash')+'</button></div>').join(''):'<div class="empty">暂无目标</div>')+
'<button class="btn primary block" style="margin-top:8px" onclick="App.goalModal(\'\')">'+icon('plus')+'新增目标</button>'+
'<div class="md-actions"><button class="btn" onclick="App.closeModal()">关闭</button></div>');
}
function taskManage(mode){
const ws=state.weekStart,we=addDays(ws,6);
const list=DB.tasks.filter(t=>t.status==='todo'&&(mode==='week'?(t.dueDate&&t.dueDate>=fmt(ws)&&t.dueDate<=fmt(we)):dueOn(t,todayStr()))).sort((a,b)=>(a.priority-b.priority)||(a.dueDate||'').localeCompare(b.dueDate||''));
openModal('<h3>'+icon(mode==='week'?'week':'today')+'任务管理</h3>'+
(list.length?list.map(t=>'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer" onclick="App.editTask(\''+t.id+'\')"><span class="tag" style="background:'+(t.priority===0?'#D64545':t.priority===1?'#D9922E':t.priority===2?'#3E7CB1':'#8b95a3')+';padding:1px 6px">'+PRI[t.priority]+'</span><div style="flex:1;min-width:0"><b style="font-size:.88rem">'+esc(t.title)+'</b><div style="font-size:.72rem;color:var(--muted)">'+(t.dueDate||'')+(t.period?' · '+periodWeekdays(t):'')+'</div></div><button class="btn sm" onclick="event.stopPropagation();App.editTask(\''+t.id+'\')">'+icon('edit')+'</button></div>').join(''):'<div class="empty">暂无任务</div>')+
'<button class="btn primary block" style="margin-top:8px" onclick="App.addTask(\'\')">'+icon('plus')+'新增计划</button>'+
'<div class="md-actions"><button class="btn" onclick="App.closeModal()">关闭</button></div>');
}
/* ========== 渲染 / 路由 ========== */
function renderSidebar(){
$('#nav').innerHTML=TABS.map(t=>'<button class="nav-i '+(state.tab===t[0]?'active':'')+'" onclick="App.nav(\''+t[0]+'\')">'+icon(t[2])+'<span>'+t[1]+'</span></button>').join('');
const s=streakInfo();
$('#side-stat').innerHTML=
'<div class="ss"><span>连续打卡</span><b>'+s.streak+' 天</b></div>'+
'<div class="ss"><span>进行中任务</span><b>'+DB.tasks.filter(t=>t.status==='todo').length+'</b></div>'+
'<div class="ss"><span>今日完成</span><b>'+DB.tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)===todayStr()).length+'</b></div>'+
'<div class="ss"><span>累计打卡</span><b>'+DB.checkins.length+' 条</b></div>';
}
function renderRail(){
const s=streakInfo();
const recent=DB.checkins.slice().sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,4);
const doneToday=DB.tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)===todayStr()).length;
const allToday=DB.tasks.filter(t=>t.status==='todo'&&dueOn(t,todayStr())).length+doneToday;
const ws=state.weekStart,we=addDays(ws,6);
const weekDone=DB.tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)>=fmt(ws)&&t.completedAt.slice(0,10)<=fmt(we)).length;
$('#rail').innerHTML=
'<div class="card quote"><h4>'+icon('quote')+'今日金句</h4><p>'+esc(quote())+'</p></div>'+
'<div class="card"><h4>'+icon('chart')+'今日概览</h4>'+
'<div class="r-stat"><span>连续打卡</span><b>'+s.streak+' 天</b></div>'+
'<div class="r-stat"><span>今日完成</span><b>'+doneToday+' / '+allToday+'</b></div>'+
'<div class="r-stat"><span>本周完成</span><b>'+weekDone+' 项</b></div></div>'+
'<div class="card"><h4>'+icon('fire')+'最近打卡</h4>'+
(recent.length?recent.map(c=>'<div class="r-chk"><span class="dot" style="background:'+TYPE_COLOR[c.type]+'"></span><div><b style="color:'+TYPE_COLOR[c.type]+'">'+c.type+'</b><small>'+esc(short(c.content))+'</small></div></div>').join(''):'<div class="empty">还没有打卡记录</div>')+'</div>'+
'<button class="btn primary block" onclick="App.checkinModal(\'\')">'+icon('spark')+'打卡成果</button>';
}
function render(){
renderSidebar();
renderRail();
const v={today:viewToday,board:viewBoard,week:viewWeek,cal:viewCal,me:viewMe}[state.tab];
$('#main').innerHTML=v();
$('#tabbar').innerHTML=TABS.map(t=>'<button class="nav-i '+(state.tab===t[0]?'active':'')+'" onclick="App.nav(\''+t[0]+'\')">'+icon(t[2])+'<span>'+t[1]+'</span></button>').join('');
window.scrollTo(0,0);
}
const App={
nav(k){state.tab=k;render();},
weekShift(n){state.weekStart=addDays(state.weekStart,n*7);render();},
weekNow(){state.weekStart=startOfWeek(new Date());render();},
weekReport:weekReport,monthReport:monthReport,buildMonthReport:buildMonthReport,
calShift(n){const d=new Date(state.calY,state.calM+n,1);state.calY=d.getFullYear();state.calM=d.getMonth();render();},
calToday(){state.calY=new Date().getFullYear();state.calM=new Date().getMonth();render();},
popDay:popDay,
addTask:addTask,periodToggle:periodToggle,weekdayPick:weekdayPick,saveTask:saveTask,
editTask:editTask,delTask:delTask,goalPlus:goalPlus,
done:done,undoDone:undoDone,defer:defer,
checkinModal:checkinModal,ckTaskPick:ckTaskPick,detectCk:detectCk,submitCheckin:submitCheckin,
exportJSON:exportJSON,copyJSON:copyJSON,openExportModal:openExportModal,copyArea:copyArea,downloadTxt:downloadTxt,
importFile:importFile,pasteImport:pasteImport,doPasteImport:doPasteImport,
clearAll:clearAll,setAutoDefer:setAutoDefer,
eventModal:eventModal,saveEvent:saveEvent,delEvent:delEvent,doneEvent:doneEvent,undoneEvent:undoneEvent,toggleHiddenEvents:toggleHiddenEvents,editEvent:editEvent,
goalModal:goalModal,editGoal:editGoal,saveGoal:saveGoal,delGoal:delGoal,
badgeManage:badgeManage,badgeModal:badgeModal,saveBadge:saveBadge,delBadge:delBadge,
goalManage:goalManage,taskManage:taskManage,
closeModal:closeModal,
syncNow:syncNow,setSyncEnabled:setSyncEnabled,setSyncKey:setSyncKey,
scrollTask(id){state.tab='today';render();setTimeout(()=>{const el=document.getElementById('tk-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.transition='box-shadow .4s';el.style.boxShadow='0 0 0 4px rgba(76,154,106,.35)';setTimeout(()=>{el.style.boxShadow='';},1600);}},60);}
};
/* ========== 初始化 ========== */
document.addEventListener('click',e=>{const p=$('#pop');if(p.style.display==='block'&&!e.target.closest('#pop')&&!e.target.closest('.cal-cell'))closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePop();}});
load();
const n=autoDefer();
settlePeriods();
render();
syncPull();
if(n)setTimeout(()=>showToast('已自动顺延 '+n+' 项逾期任务到明天'),600);
</script>
</body>
</html>
